<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebGL Transformations</title>
</head>
<body>
<h2>Square Transformations</h2>
<button onclick="moveSquare()">Translation</button>
<button onclick="scale()">Scaling</button>
<button onclick="rotate()">Rotation</button>
<button onclick="reset()">Reset</button>
<br><br>
<canvas id="canvas" width="500" height="500"
style="border:1px solid black;">
</canvas>
<script>
// 1. Get Canvas and WebGL
const canvas = document.getElementById("canvas");
const gl = canvas.getContext("webgl");

// 2. Square vertices (two triangles = 6 vertices)
const vertices = new Float32Array([
  -0.4, -0.4,
   0.4, -0.4,
   0.4,  0.4,

  -0.4, -0.4,
   0.4,  0.4,
  -0.4,  0.4
]);

// 3. Vertex Shader
const vertexShader = `
attribute vec2 position;
uniform mat3 transform;
void main() {
  vec3 p = transform * vec3(position, 1.0);
  gl_Position = vec4(p.xy, 0.0, 1.0);
}
`;

// 4. Fragment Shader
const fragmentShader = `
precision mediump float;
void main() {
  gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
}`;

// 5. Create and compile shaders
const vs = gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(vs, vertexShader);
gl.compileShader(vs);

const fs = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(fs, fragmentShader);
gl.compileShader(fs);

// 6. Create Program
const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
gl.useProgram(program);

// 7. Create Buffer
const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

// 8. Connect position
const position = gl.getAttribLocation(program, "position");
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
gl.enableVertexAttribArray(position);

// 9. Get Matrix location
const transformLocation = gl.getUniformLocation(program, "transform");

// Transformation values
let tx = 0, ty = 0;
let sx = 1, sy = 1;
let angle = 0;

// 10. Draw Square
function draw() {
  const c = Math.cos(angle);
  const s = Math.sin(angle);

  // Transformation Matrix
  const matrix = new Float32Array([
    c * sx,  s * sx, 0,
    -s * sy, c * sy, 0,
    tx,      ty,     1
  ]);

  gl.uniformMatrix3fv(transformLocation, false, matrix);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.05, 0.1, 0.3, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}

// 11. Translation
function moveSquare() {
  tx += 0.2;
  ty += 0.1;
  draw();
}

// 12. Scaling
function scale() {
  sx *= 1.2;
  sy *= 1.2;
  draw();
}

// 13. Rotation
function rotate() {
  angle += Math.PI / 6;
  draw();
}

// 14. Reset
function reset() {
  tx = 0;
  ty = 0;
  sx = 1;
  sy = 1;
  angle = 0;
  draw();
}

// Initial drawing
draw();
</script>
