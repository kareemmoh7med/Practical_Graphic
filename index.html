<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL Transformations</title>
<style>
  body { font-family: sans-serif; text-align: center; }
  canvas { border: 1px solid black; max-width: 100%; }
  .group { margin: 12px 0; }
  .group h3 { margin: 6px 0; }
  button { padding: 8px 14px; margin: 3px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<h2>Square Transformations</h2>

<canvas id="canvas" width="500" height="500"></canvas>

<div class="group">
  <h3>Translation</h3>
  <button onclick="move(-0.2, 0)">&larr; Left</button>
  <button onclick="move(0.2, 0)">Right &rarr;</button>
  <button onclick="move(0, 0.2)">&uarr; Up</button>
  <button onclick="move(0, -0.2)">Down &darr;</button>
</div>

<div class="group">
  <h3>Scaling</h3>
  <button onclick="scaleBy(1.2)">Bigger +</button>
  <button onclick="scaleBy(1 / 1.2)">Smaller &minus;</button>
</div>

<div class="group">
  <h3>Rotation</h3>
  <button onclick="rotateBy(90)">90&deg;</button>
  <button onclick="rotateBy(180)">180&deg;</button>
  <button onclick="rotateBy(360)">360&deg;</button>
</div>

<div class="group">
  <button onclick="reset()">Reset</button>
</div>

<script>
// 1. Get Canvas and WebGL
const canvas = document.getElementById("canvas");
const gl = canvas.getContext("webgl");

// 2. Square vertices (two triangles = 6 vertices)
const vertices = new Float32Array([
  -0.4, -0.4,
   0.4, -0.4,
   0.4,  0.4,

  -0.4, -0.4,
   0.4,  0.4,
  -0.4,  0.4
]);

// 3. Vertex Shader
const vertexShader = `
attribute vec2 position;
uniform mat3 transform;
void main() {
  vec3 p = transform * vec3(position, 1.0);
  gl_Position = vec4(p.xy, 0.0, 1.0);
}
`;

// 4. Fragment Shader
const fragmentShader = `
precision mediump float;
void main() {
  gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
}`;

// 5. Create and compile shaders
const vs = gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(vs, vertexShader);
gl.compileShader(vs);

const fs = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(fs, fragmentShader);
gl.compileShader(fs);

// 6. Create Program
const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
gl.useProgram(program);

// 7. Create Buffer
const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

// 8. Connect position
const position = gl.getAttribLocation(program, "position");
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
gl.enableVertexAttribArray(position);

// 9. Get Matrix location
const transformLocation = gl.getUniformLocation(program, "transform");

// Transformation values
const state = { tx: 0, ty: 0, s: 1, angle: 0 }; // angle in radians

// 10. Draw Square
function draw() {
  const c = Math.cos(state.angle);
  const s = Math.sin(state.angle);

  const matrix = new Float32Array([
    c * state.s,  s * state.s, 0,
    -s * state.s, c * state.s, 0,
    state.tx,     state.ty,    1
  ]);

  gl.uniformMatrix3fv(transformLocation, false, matrix);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.05, 0.1, 0.3, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}

// Smooth animation to a target state
let animId = null;
function animateTo(target, duration = 400) {
  if (animId) cancelAnimationFrame(animId);
  const from = { ...state };
  const start = performance.now();
  function step(now) {
    const t = Math.min((now - start) / duration, 1);
    const e = t * (2 - t); // ease-out
    for (const k in target) {
      state[k] = from[k] + (target[k] - from[k]) * e;
    }
    draw();
    if (t < 1) animId = requestAnimationFrame(step);
  }
  animId = requestAnimationFrame(step);
}

// 11. Translation (left / right / up / down)
function move(dx, dy) {
  animateTo({ tx: state.tx + dx, ty: state.ty + dy, s: state.s, angle: state.angle });
}

// 12. Scaling (bigger / smaller)
function scaleBy(factor) {
  animateTo({ tx: state.tx, ty: state.ty, s: state.s * factor, angle: state.angle });
}

// 13. Rotation (90 / 180 / 360 degrees)
function rotateBy(deg) {
  animateTo({ tx: state.tx, ty: state.ty, s: state.s, angle: state.angle + deg * Math.PI / 180 }, 600);
}

// 14. Reset
function reset() {
  animateTo({ tx: 0, ty: 0, s: 1, angle: 0 });
}

// Initial drawing
draw();
</script>

</html>
